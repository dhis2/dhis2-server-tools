---
# CrowdSec on OpenResty: install, idempotence, enforcement (verify.yml), then switching it
# off (side_effect.yml). The role's own pre-flight accepts only ansible_connection=lxd, so
# the playbooks drive tasks/deploy.yml - everything after those asserts - over docker.
# MOLECULE_CROWDSEC_IMAGE overrides the image, e.g. with one that has the packages cached.
dependency:
  name: galaxy
  options:
    ignore-certs: true
    ignore-errors: true
driver:
  name: docker
platforms:
  - name: crowdsec-web
    image: ${MOLECULE_CROWDSEC_IMAGE:-geerlingguy/docker-ubuntu2404-ansible:latest}
    pre_build_image: true
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    privileged: true
    cgroupns_mode: host
    groups:
      - web
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/deploy/roles
    ANSIBLE_FILTER_PLUGINS: ${MOLECULE_PROJECT_DIRECTORY}/deploy/filter_plugins
    ANSIBLE_LIBRARY: ${MOLECULE_PROJECT_DIRECTORY}/deploy/library
  config_options:
    defaults:
      interpreter_python: auto_silent
      callback_result_format: yaml
  inventory:
    hosts:
      all:
        children:
          monitoring:
            hosts: {}
          instances:
            hosts: {}
    group_vars:
      all:
        proxy: openresty
        crowdsec_enabled: true
        # Keep CI runs from registering throwaway machines with CrowdSec's Central API.
        crowdsec_online_api_enabled: false
        crowdsec_allowlist: ["192.0.2.10"]
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - side_effect
    - destroy
