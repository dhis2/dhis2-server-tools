---
# Secrets live on the Ansible controller in /opt/ansible/secrets/ (same as DB
# passwords). User-supplied channel tokens are files the operator creates.
# Machine secrets (web auth password, Glowroot forwarder token) are auto-generated.
# Bcrypt for Alertmanager web auth is created later on the monitoring host (hub.yml).

- name: Alerting | Ensure controller secrets directory exists
  vars:
    ansible_connection: local
  ansible.builtin.file:
    path: '{{ alerting_secrets_dir }}'
    state: directory
    mode: '0700'
    owner: "{{ lookup('env', 'USER') }}"
    group: "{{ lookup('pipe', 'id -gn') | trim }}"
  become: true
  delegate_to: 127.0.0.1

- name: Alerting | Load Telegram bot token from secrets dir
  ansible.builtin.set_fact:
    alerting_telegram_bot_token: "{{ lookup('file', alerting_secrets_dir ~ '/alerting_telegram_bot_token') | trim }}"
  when:
    - alerting_telegram_bot_token is not defined
      or alerting_telegram_bot_token | length == 0
    - lookup('fileglob', alerting_secrets_dir ~ '/alerting_telegram_bot_token') | length > 0
  no_log: true

- name: Alerting | Load Telegram chat ID from secrets dir
  ansible.builtin.set_fact:
    alerting_telegram_chat_id: "{{ lookup('file', alerting_secrets_dir ~ '/alerting_telegram_chat_id') | trim }}"
  when:
    - alerting_telegram_chat_id is not defined
      or alerting_telegram_chat_id | string | length == 0
    - lookup('fileglob', alerting_secrets_dir ~ '/alerting_telegram_chat_id') | length > 0

- name: Alerting | Load Slack webhook URL from secrets dir
  ansible.builtin.set_fact:
    alerting_slack_webhook_url: "{{ lookup('file', alerting_secrets_dir ~ '/alerting_slack_webhook_url') | trim }}"
  when:
    - alerting_slack_webhook_url is not defined
      or alerting_slack_webhook_url | length == 0
    - lookup('fileglob', alerting_secrets_dir ~ '/alerting_slack_webhook_url') | length > 0
  no_log: true

- name: Alerting | Load SMTP auth password from secrets dir
  ansible.builtin.set_fact:
    alerting_smtp_auth_password: "{{ lookup('file', alerting_secrets_dir ~ '/alerting_smtp_auth_password') | trim }}"
  when:
    - alerting_smtp_auth_password is not defined
      or alerting_smtp_auth_password | length == 0
    - lookup('fileglob', alerting_secrets_dir ~ '/alerting_smtp_auth_password') | length > 0
  no_log: true

- name: Alerting | Ensure Alertmanager web password exists
  ansible.builtin.set_fact:
    alerting_web_basic_auth_password: >-
      {{ alerting_web_basic_auth_password
         | default(lookup('password', alerting_secrets_dir ~ '/alerting_web_password length=32 chars=ascii_letters,digits'), true) }}
  when: alerting_web_basic_auth_enabled | default(true) | bool
  no_log: true

- name: Alerting | Ensure Glowroot forwarder token exists
  ansible.builtin.set_fact:
    alerting_glowroot_forwarder_token: >-
      {{ alerting_glowroot_forwarder_token
         | default(lookup('password', alerting_secrets_dir ~ '/alerting_glowroot_forwarder_token length=48 chars=ascii_letters,digits'), true) }}
  when:
    - groups['instances'] | default([]) | length > 0
    - app_monitoring | default('') == 'glowroot'
  no_log: true

- name: Alerting | Normalize controller secrets file permissions
  vars:
    ansible_connection: local
  become: true
  ansible.builtin.file:
    dest: '{{ item }}'
    owner: "{{ lookup('env', 'USER') }}"
    group: "{{ lookup('pipe', 'id -gn') | trim }}"
    mode: '0600'
  delegate_to: 127.0.0.1
  with_fileglob:
    - '{{ alerting_secrets_dir }}/alerting_*'
  when: item is file
