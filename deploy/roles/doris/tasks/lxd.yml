---
# LXD-only concerns: creating the container, and disabling swap on the LXD
# HOST (not the container) - Doris and any co-located containers share the
# host kernel, so swap must be off at that level. Everything connection-
# agnostic (installing Doris itself) lives in install.yml.
- name: Creating Doris container for lxd setup
  vars:
    ansible_connection: local
  when: is_doris_host
  community.general.lxd_container:
    name: "{{ inventory_hostname }}"
    config: "{{ {'limits.memory': lxd_memory_limit} if lxd_memory_limit is defined else {} }}"
    state: started
    profiles: [default]
    ignore_volatile_options: false
    wait_for_ipv4_addresses: true
    timeout: 600
    source:
      type: image
      mode: pull
      server: "{{ lxd_source_server | default('https://cloud-images.ubuntu.com/releases') }}"
      protocol: "{{ lxd_source_protocol | default('simplestreams') }}"
      alias: "{{ guest_os }}/{{ guest_os_arch | default('amd64') }}"
    devices:
      eth0:
        nictype: bridged
        parent: "{{ lxd_bridge_interface | default('lxdbr1') }}"
        type: nic
        ipv4.address: "{{ ansible_host | ansible.utils.ipaddr(lxd_network) }}"

- name: Gather LXD host facts
  vars:
    ansible_connection: local
  ansible.builtin.setup:
    gather_subset:
      - hardware
      - "!min"
  delegate_to: 127.0.0.1
  delegate_facts: true
  run_once: true
  when: doris_instance_map | length > 0

- name: Disable swap temporarily on the LXD host
  vars:
    ansible_connection: local
  ansible.builtin.command: swapoff -a
  delegate_to: 127.0.0.1
  run_once: true
  when:
    - doris_instance_map | length > 0
    - hostvars['127.0.0.1']['ansible_swaptotal_mb'] | default(0) | int > 0
  changed_when: true

- name: Disable swap permanently in fstab on the LXD host
  vars:
    ansible_connection: local
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*swap.*)$'
    replace: '# \1'
  delegate_to: 127.0.0.1
  run_once: true
  when: doris_instance_map | length > 0

- name: Provision Apache Doris
  ansible.builtin.include_tasks: install.yml
