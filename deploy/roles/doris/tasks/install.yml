---
# Connection-agnostic Doris provisioning, included by both lxd.yml and ssh.yml
# once their connection-specific setup (container creation / acl+ssh+swap) is
# done. Everything here behaves identically whether Ansible reached this host
# via the lxd or ssh connection plugin.
- name: Ensure system is updated
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
    cache_valid_time: 3600
  when: is_doris_host

- name: Set file descriptor limits
  ansible.builtin.lineinfile:
    path: /etc/security/limits.conf
    owner: root
    group: root
    mode: '0600'
    line: "{{ item }}"
    create: true
  loop:
    - "* soft nofile 1000000"
    - "* hard nofile 1000000"
  when: is_doris_host

- name: Increase virtual memory area limit
  ansible.posix.sysctl:
    name: vm.max_map_count
    value: "2000000"
    state: present
    reload: true
  when: is_doris_host

# Needed for doris_build_variant (ansible_flags) and doris_fe_heap_mb /
# doris_be_mem_limit_mb (ansible_memtotal_mb) in defaults/main.yml. Harmless to
# re-gather if ssh.yml already ran "Get host facts" on this same host.
- name: Gather Doris host facts
  ansible.builtin.setup:
    gather_subset:
      - hardware
      - "!min"
  when: is_doris_host

- name: Install Java 17 runtime
  ansible.builtin.apt:
    name: openjdk-17-jre-headless
    state: present
  when: is_doris_host

- name: Create Doris system user
  ansible.builtin.user:
    name: "{{ doris_user }}"
    comment: "Doris Application User"
    home: "{{ doris_home }}"
    shell: /bin/bash
    system: true
    create_home: true
  when: is_doris_host

- name: Download Doris binaries
  become: true
  become_user: "{{ doris_user }}"
  ansible.builtin.get_url:
    url: "{{ doris_download_url }}"
    dest: "{{ doris_home }}/{{ doris_tarball }}"
    mode: '0644'
  when: is_doris_host

# Gated on a marker file touched only after tar exits cleanly, so it runs
# exactly once per tarball. Not "creates: {{ doris_home }}/fe" - fe/ exists the
# moment tar starts writing, so a crashed extraction (disk full, network drop)
# still looks complete and its truncated jars are never repaired. The marker
# name carries the tarball name, so switching build variants re-extracts once.
- name: Extract Doris binaries into {{ doris_home }}
  become_user: "{{ doris_user }}"
  become: true
  ansible.builtin.unarchive:
    src: "{{ doris_home }}/{{ doris_tarball }}"
    dest: "{{ doris_home }}"
    remote_src: true
    extra_opts: [--strip-components=1]
    creates: "{{ doris_home }}/.installed-{{ doris_tarball }}"
  register: doris_extract
  when: is_doris_host
  notify:
    - Restart Doris FE
    - Restart Doris BE

- name: Mark Doris build as installed
  become_user: "{{ doris_user }}"
  become: true
  ansible.builtin.file:
    path: "{{ doris_home }}/.installed-{{ doris_tarball }}"
    state: touch
    mode: '0644'
  when:
    - is_doris_host
    - doris_extract is changed

- name: Configure JAVA_HOME in fe.conf
  ansible.builtin.lineinfile:
    path: "{{ doris_home }}/fe/conf/fe.conf"
    mode: '0600'
    regexp: '^JAVA_HOME='
    line: 'JAVA_HOME="{{ java_home }}"'
    create: true
  when: is_doris_host

# lower_case_table_names is immutable once the FE metadata is bootstrapped,
# so it MUST be written to fe.conf before the FE is started for the first
# time. DHIS2 requires it set to 1 (case-insensitive, names stored lowercase).
- name: Set lower_case_table_names in fe.conf (before first FE start)
  ansible.builtin.lineinfile:
    path: "{{ doris_home }}/fe/conf/fe.conf"
    mode: '0600'
    regexp: '^\s*lower_case_table_names\s*='
    line: 'lower_case_table_names = 1'
    create: true
  when: is_doris_host

# Rewrites every -Xms/-Xmx in fe.conf, so both the JAVA_OPTS and
# JAVA_OPTS_FOR_JDK_17 blocks are covered regardless of which one is active.
# doris_fe_heap_size (inventory override) wins when set; otherwise falls back
# to doris_fe_heap_mb, auto-sized from this host's real RAM.
- name: Size FE JVM heap to fit the host
  ansible.builtin.replace:
    path: "{{ doris_home }}/fe/conf/fe.conf"
    regexp: '-Xm([sx])\S+'
    replace: "-Xm\\g<1>{{ doris_fe_heap_size | default(doris_fe_heap_mb ~ 'm') }}"
  when: is_doris_host
  notify: Restart Doris FE

- name: Configure JAVA_HOME in be.conf
  ansible.builtin.lineinfile:
    path: "{{ doris_home }}/be/conf/be.conf"
    mode: '0600'
    regexp: '^JAVA_HOME='
    line: 'JAVA_HOME="{{ java_home }}"'
    create: true
  when: is_doris_host

# doris_be_mem_limit (inventory override) wins when set; otherwise falls back
# to doris_be_mem_limit_mb, auto-sized from this host's real RAM.
- name: Cap BE memory usage
  ansible.builtin.lineinfile:
    path: "{{ doris_home }}/be/conf/be.conf"
    mode: '0600'
    regexp: '^\s*#?\s*mem_limit\s*='
    line: "mem_limit = {{ doris_be_mem_limit | default(doris_be_mem_limit_mb ~ 'M') }}"
    create: true
  when: is_doris_host
  notify: Restart Doris BE

- name: Create systemd unit for Doris Frontend
  ansible.builtin.copy:
    dest: /etc/systemd/system/doris-fe.service
    group: root
    owner: root
    mode: '0600'
    content: |
      [Unit]
      Description=Apache Doris Frontend (FE)
      After=network.target

      [Service]
      Type=forking
      User={{ doris_user }}
      WorkingDirectory={{ doris_home }}/fe
      ExecStart={{ doris_home }}/fe/bin/start_fe.sh --daemon
      ExecStop={{ doris_home }}/fe/bin/stop_fe.sh
      Restart=on-failure

      [Install]
      WantedBy=multi-user.target
  when: is_doris_host

- name: Create systemd unit for Doris Backend
  ansible.builtin.copy:
    group: root
    owner: root
    mode: '0600'
    dest: /etc/systemd/system/doris-be.service
    content: |
      [Unit]
      Description=Apache Doris Backend (BE)
      After=network-online.target

      [Service]
      Type=forking
      User={{ doris_user }}
      LimitCORE=infinity
      LimitNOFILE=200000
      WorkingDirectory={{ doris_home }}/be
      ExecStart={{ doris_home }}/be/bin/start_be.sh --daemon
      ExecStop={{ doris_home }}/be/bin/stop_be.sh
      Restart=on-failure

      [Install]
      WantedBy=multi-user.target
  when: is_doris_host

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true
  when: is_doris_host

- name: Enable and start Doris FE
  ansible.builtin.systemd:
    name: doris-fe
    enabled: true
    state: started
  when: is_doris_host

- name: Enable and start Doris BE
  ansible.builtin.systemd:
    name: doris-be
    enabled: true
    state: started
  when: is_doris_host

- name: Ensure PyMySQL is installed (required for community.mysql modules)
  ansible.builtin.apt:
    name: python3-pymysql
    state: present
  when: is_doris_host

- name: Install MySQL client (optional, for connecting to Doris)
  ansible.builtin.apt:
    # Version-agnostic metapackage - a hardcoded "-8.0" package name breaks
    # the moment the target OS moves to a newer default MySQL version.
    name: default-mysql-client-core
    state: present
  when: is_doris_host

# First-boot metadata bootstrap on a small host exceeds 60s.
- name: Wait for Doris FE port to be available
  ansible.builtin.wait_for:
    host: "127.0.0.1"
    port: 9030
    delay: 5
    timeout: 300
  when: is_doris_host

- name: Register Doris BE with FE
  community.mysql.mysql_query:
    login_user: root
    login_host: 127.0.0.1
    login_port: 9030
    query: "ALTER SYSTEM ADD BACKEND '127.0.0.1:9050';"
  failed_when: false
  when: is_doris_host

- name: Wait for Doris BE to report alive to FE
  community.mysql.mysql_query:
    login_user: root
    login_host: 127.0.0.1
    login_port: 9030
    query: "SHOW BACKENDS;"
  register: doris_backend_status
  until: doris_backend_status.query_result[0] | selectattr('Alive', 'equalto', 'true') | list | length > 0
  retries: 30
  delay: 5
  when: is_doris_host

- name: Ensure analytics database exists
  community.mysql.mysql_db:
    name: analytics
    state: present
    login_user: root
    login_host: 127.0.0.1
    login_port: 9030
  when: is_doris_host

- name: Ensure Doris user exists
  community.mysql.mysql_query:
    login_user: root
    login_password: "{{ mysql_root_password | default(omit) }}"
    login_host: 127.0.0.1
    login_port: 9030
    query: >
      CREATE USER IF NOT EXISTS
      '{{ apache_doris_db_user | default("doris_user") }}'@'%'
      IDENTIFIED BY '{{ apache_doris_db_password |
        default(lookup("password",
        "/opt/ansible/secrets/apache_doris_db_password length=24 chars=ascii_letters,digits")) }}';
  when: is_doris_host

- name: Ensure Doris DB admin user has full privileges on analytics
  community.mysql.mysql_query:
    login_user: root
    login_password: "{{ mysql_root_password | default(omit) }}"
    login_host: 127.0.0.1
    login_port: 9030
    query: >
      GRANT ALL ON *.*.* TO '{{ apache_doris_db_user | default("doris_user") }}'@'%';
  when: is_doris_host

- name: Ensure JDBC directories exist (FE and BE)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ doris_user }}"
    group: "{{ doris_user }}"
    mode: '0755'
  loop:
    - "{{ doris_home }}/fe/jdbc_drivers"
    - "{{ doris_home }}/be/jdbc_drivers"
  when: is_doris_host

- name: Download PostgreSQL JDBC driver
  ansible.builtin.get_url:
    url: https://jdbc.postgresql.org/download/postgresql-42.7.8.jar
    owner: "{{ doris_user }}"
    group: "{{ doris_user }}"
    dest: /tmp/postgresql-42.7.8.jar
    mode: '0644'
  when: is_doris_host

- name: Copy JDBC driver to FE and BE
  ansible.builtin.copy:
    src: /tmp/postgresql-42.7.8.jar
    owner: "{{ doris_user }}"
    group: "{{ doris_user }}"
    dest: "{{ item }}/postgresql.jar"
    remote_src: true
    mode: '0644'
  loop:
    - "{{ doris_home }}/fe/jdbc_drivers/"
    - "{{ doris_home }}/be/jdbc_drivers"
  when: is_doris_host

- name: Checking postgresql Version
  become: true
  become_user: postgres
  community.postgresql.postgresql_info:
    filter: ver*
  register: postgresql_version_info
  loop: "{{ groups['instances'] }}"
  when:
    - hostvars[item]['apache_doris_db'] is defined
    - hostvars[hostvars[item]['apache_doris_db']] is defined
    - inventory_hostname == hostvars[item]['database_host']
  tags:
    - pg_version

- name: Edit postgresql pg_hba.conf
  loop: "{{ groups['instances'] }}"
  loop_control:
    index_var: idx
  ansible.builtin.lineinfile:
    path: /etc/postgresql/{{ postgresql_version_info.results[idx].version.major }}/main/pg_hba.conf
    regexp: "^(host|hostssl)\\s+{{ item }}\\s+{{ hostvars[item]['apache_doris_db'] }}\\s+{{ hostvars[hostvars[item]['apache_doris_db']]['service_ip'] | default(hostvars[hostvars[item]['apache_doris_db']]['ansible_host']) }}(/32)?\\s+.*$"
    insertafter: EOF
    line: "hostssl {{ item }} {{ item }} {{ hostvars[hostvars[item]['apache_doris_db']]['service_ip'] | default(hostvars[hostvars[item]['apache_doris_db']]['ansible_host']) }}/32 scram-sha-256"
  when:
    - hostvars[item]['apache_doris_db'] is defined
    - hostvars[hostvars[item]['apache_doris_db']] is defined
    - inventory_hostname == hostvars[item]['database_host']
  tags:
    - pg_version

- name: Firewall | Open port 5432 from doris instances
  community.general.ufw:
    rule: allow
    port: "{{ postgresql_port | default('5432') }}"
    src: "{{ hostvars[hostvars[item]['apache_doris_db']]['service_ip'] | default(hostvars[hostvars[item]['apache_doris_db']]['ansible_host']) }}"
    proto: tcp
    comment: "Allow access from {{ hostvars[hostvars[item]['apache_doris_db']]['service_ip'] | default(hostvars[hostvars[item]['apache_doris_db']]['ansible_host']) }} Doris instance"
    state: enabled
  loop: "{{ groups['instances'] }}"
  when:
    - hostvars[item]['apache_doris_db'] is defined
    - hostvars[hostvars[item]['apache_doris_db']] is defined
    - inventory_hostname == hostvars[item]['database_host']

# This rule was missing entirely - nothing previously opened 9030 on the
# Doris host itself, so DHIS2 instances could reach Postgres traffic-wise but
# Doris's own query port depended on ufw being inactive or on a rule from
# elsewhere. Restricted to instances that actually reference this host, same
# pattern as the 5432 rule above.
- name: Firewall | Open port 9030 from dhis2 instances
  community.general.ufw:
    rule: allow
    port: "{{ doris_query_port | default('9030') }}"
    src: "{{ hostvars[item]['service_ip'] | default(hostvars[item]['ansible_host']) }}"
    proto: tcp
    comment: "Allow doris query access from {{ item }} instance "
    state: enabled
  loop: "{{ groups['instances'] }}"
  when:
    - hostvars[item]['apache_doris_db'] is defined
    - inventory_hostname == hostvars[item]['apache_doris_db']
