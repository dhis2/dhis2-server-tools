---
# ssh-only concerns, mirroring roles/postgres/tasks/ssh.yml: get facts, install
# acl (become_user: doris later needs setfacl - the lxd connection plugin
# connects as root, where chown suffices, so acl is only needed here), and
# open ssh before any rule that might enable ufw. Swap is disabled on this
# host directly - unlike the LXD case, there is no separate "host" to delegate
# to, the ssh target IS the host running Doris.
- name: Get host facts
  ansible.builtin.setup:
    gather_subset:
      - hardware
      - "!min"
  when: is_doris_host

# Pre-seed grub-pc's boot-device debconf answer on THIS host before any apt
# task that might install/reconfigure it - this host's own debconf database
# is separate from the Ansible controller's (deploy.sh pre-seeds only the
# controller's). On QEMU/KVM VMs this question can be genuinely unanswered
# until a kernel-related update pulls grub-pc in as a dependency, and
# DEBIAN_FRONTEND=noninteractive/--force-confdef alone don't help then -
# with no existing answer to fall back to, grub-install fails outright
# ("/multiselect does not exist") instead of just proceeding. Harmless to
# seed even if grub-pc never ends up installed (UEFI boots use grub-efi
# instead and never ask this). Strips a trailing partition suffix (sda2 ->
# sda, nvme0n1p2 -> nvme0n1) so this works whether root sits on a partition
# or directly on a whole, unpartitioned disk.
- name: Determine boot disk for grub-pc pre-seed
  ansible.builtin.set_fact:
    doris_boot_disk: "{{ (ansible_mounts | selectattr('mount', 'equalto', '/') | map(attribute='device') | first | default('')) | regex_replace('^(/dev/(?:[a-z]+|nvme\\d+n\\d+))(?:p?\\d+)?$', '\\1') }}"
  when: is_doris_host

- name: Pre-seed grub-pc install_devices answer
  ansible.builtin.debconf:
    name: grub-pc
    question: "{{ item.question }}"
    value: "{{ item.value }}"
    vtype: "{{ item.vtype }}"
  loop:
    - { question: "grub-pc/install_devices", value: "{{ doris_boot_disk }}", vtype: "multiselect" }
    - { question: "grub-pc/install_devices_empty", value: "false", vtype: "boolean" }
  # A freshly-booted VM's own boot-time package management (cloud-init,
  # unattended-upgrades) can still be holding debconf's database lock when
  # this runs - "DbDriver config: ... is locked by another process". That
  # lock is transient by nature, so retry instead of failing outright.
  register: doris_grubpc_preseed
  retries: 6
  delay: 10
  until: doris_grubpc_preseed is not failed
  when:
    - is_doris_host
    - doris_boot_disk | default('') | length > 0

- name: Installing acl package
  ansible.builtin.apt:
    name: acl
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: is_doris_host

- name: Allow ssh on port 22
  community.general.ufw:
    rule: limit
    port: "{{ ansible_port | default('22') }}"
    src: "0.0.0.0/0"
    proto: tcp
    comment: Allow ssh access to the Doris host
  when: is_doris_host

- name: Disable swap temporarily
  ansible.builtin.command: swapoff -a
  when:
    - is_doris_host
    - ansible_swaptotal_mb | default(0) | int > 0
  changed_when: true

- name: Disable swap permanently in fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*swap.*)$'
    replace: '# \1'
  when: is_doris_host

- name: Provision Apache Doris
  ansible.builtin.include_tasks: install.yml
