---
# The rule is deleted again when metrics stop being exposed, so turning
# crowdsec_metrics_expose off (or removing the role) doesn't leave the port open.
- name: Crowdsec | Allow metrics scrapes from the monitoring host(s) only
  community.general.ufw:
    rule: allow
    port: "{{ crowdsec_metrics_port | string }}"
    src: "{{ hostvars[item]['service_ip'] | default(hostvars[item]['ansible_host']) }}"
    proto: tcp
    comment: "Allow crowdsec metrics scrape from prometheus/grafana server"
    delete: "{{ not (crowdsec_metrics_exposed | bool) }}"
  loop: "{{ groups['monitoring'] | default([]) }}"
