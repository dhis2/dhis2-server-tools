---
- name: Crowdsec | Install apt prerequisites for the CrowdSec repo
  ansible.builtin.apt:
    name: ca-certificates
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Crowdsec | Ensure the apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

# get_url downloads to a temp file and moves it into place only on success, so a failed
# download leaves nothing that a later run could mistake for the key. apt reads the
# ASCII-armored key directly because of the .asc extension.
- name: Crowdsec | Download CrowdSec signing key
  ansible.builtin.get_url:
    url: https://packagecloud.io/crowdsec/crowdsec/gpgkey
    dest: "{{ crowdsec_keyring }}"
    owner: root
    group: root
    mode: "0644"
  register: crowdsec_key_download
  until: crowdsec_key_download is succeeded
  retries: 3
  delay: 5

# Hosts set up with the key dearmored into /usr/share/keyrings: apt refuses two entries for
# the same repo with different Signed-By values, and a failed curl there left a 0-byte
# keyring that apt rejects on every update.
- name: Crowdsec | Remove the repo entry signed by the dearmored keyring
  ansible.builtin.apt_repository:
    repo: "deb [signed-by={{ crowdsec_legacy_keyring }}] {{ crowdsec_repo_url }} any main"
    state: absent
    filename: crowdsec
    update_cache: false

- name: Crowdsec | Remove the dearmored keyring
  ansible.builtin.file:
    path: "{{ crowdsec_legacy_keyring }}"
    state: absent

- name: Crowdsec | Add CrowdSec official repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by={{ crowdsec_keyring }}] {{ crowdsec_repo_url }} any main"
    state: present
    filename: crowdsec

# The crowdsec package's postinst runs debconf-driven prompts (crowdsec/lapi, crowdsec/capi)
# the first time it configures. Preseeding avoids it hanging/defaulting unpredictably under
# DEBIAN_FRONTEND=noninteractive (which the apt module already sets).
- name: Crowdsec | Preseed LAPI debconf question (always run a local API here)
  ansible.builtin.debconf:
    name: crowdsec
    question: crowdsec/lapi
    vtype: boolean
    value: "true"

- name: Crowdsec | Preseed Central API / community blocklist debconf question
  ansible.builtin.debconf:
    name: crowdsec
    question: crowdsec/capi
    vtype: boolean
    value: "{{ crowdsec_online_api_enabled | bool | lower }}"

- name: Crowdsec | Install CrowdSec Security Engine
  ansible.builtin.apt:
    name: "{{ 'crowdsec' if crowdsec_version | string == 'latest' else 'crowdsec=' ~ (crowdsec_version | string) }}"
    state: "{{ 'latest' if crowdsec_version | string == 'latest' else 'present' }}"
    allow_downgrade: true
    allow_change_held_packages: true
    update_cache: true
    cache_valid_time: 3600

# The proxy role runs `apt upgrade` on every deploy, which would otherwise move a pinned
# engine to the newest version in the repo.
- name: Crowdsec | Hold the Security Engine at the pinned version
  ansible.builtin.dpkg_selections:
    name: crowdsec
    selection: "{{ 'install' if crowdsec_version | string == 'latest' else 'hold' }}"

- name: Crowdsec | Template local config overrides (LAPI bind address, Prometheus metrics)
  ansible.builtin.template:
    src: config.yaml.local.j2
    dest: "{{ crowdsec_managed_marker }}"
    owner: root
    group: root
    mode: "0640"
  notify: Restart crowdsec

# The postinst writes the agent's LAPI URL once, from the default listen_uri, before the
# template above runs. Keep it in step with crowdsec_lapi_port, or the engine can't reach
# its own LAPI and crash-loops.
- name: Crowdsec | Point the engine's agent at the local API
  ansible.builtin.lineinfile:
    path: /etc/crowdsec/local_api_credentials.yaml
    regexp: "^url:"
    line: "url: {{ crowdsec_lapi_url }}"
  diff: false
  notify: Restart crowdsec

# The crowdsec/capi debconf answer is only read on first install. An empty credentials
# file is how the engine runs with the Central API off ("push and pull to Central API
# disabled"); the package's own postinst leaves it that way when crowdsec/capi is false.
- name: Crowdsec | Check Central API credentials
  ansible.builtin.stat:
    path: /etc/crowdsec/online_api_credentials.yaml
  register: crowdsec_capi_credentials

- name: Crowdsec | Register with the Central API
  ansible.builtin.command: cscli capi register --error
  when:
    - crowdsec_online_api_enabled | bool
    - crowdsec_capi_credentials.stat.size | default(0) == 0
  changed_when: true
  notify: Restart crowdsec

- name: Crowdsec | Drop Central API credentials (no signal sharing, no community blocklist)
  ansible.builtin.copy:
    content: ""
    dest: /etc/crowdsec/online_api_credentials.yaml
    owner: root
    group: root
    mode: "0600"
  diff: false
  when: not (crowdsec_online_api_enabled | bool)
  notify: Restart crowdsec

# A conf.d file rather than a line in the proxy role's nginx.conf, so --tags crowdsec on an
# existing deployment sets it up too. nginx.conf includes conf.d/*.conf inside http {}.
- name: Crowdsec | Write the OpenResty access log CrowdSec reads
  ansible.builtin.template:
    src: openresty-access-log.conf.j2
    dest: "{{ crowdsec_openresty_conf_dir }}/crowdsec_access_log.conf"
    owner: root
    group: root
    mode: "0640"
  when: proxy == 'openresty'
  notify: Crowdsec | Reload OpenResty

# The postinst (cscli setup unattended) generates setup.openresty.yaml with a logs/*.log
# glob, which also tails the tab-separated perf.log that the nginx parser can't read.
# Once a hand-managed file exists in acquis.d, later unattended runs (on every package
# upgrade) stop without regenerating theirs.
- name: Crowdsec | Template OpenResty log acquisition
  ansible.builtin.template:
    src: acquis-openresty.yaml.j2
    dest: /etc/crowdsec/acquis.d/openresty.yaml
    owner: root
    group: root
    mode: "0644"
  when: proxy == 'openresty'
  notify: Restart crowdsec

# A second file reading the same logs makes the engine count every request twice, so
# scenarios ban at half their thresholds. Match on content, not on the generated file's
# name, which differs between crowdsec releases.
- name: Crowdsec | Find other acquisition files reading the OpenResty logs
  ansible.builtin.find:
    paths:
      - /etc/crowdsec
      - /etc/crowdsec/acquis.d
    patterns: ["*.yaml", "*.yml"]
    # re.match per line, so anchored at the line start
    contains: ".*{{ crowdsec_openresty_logs_dir | regex_escape }}"
  register: crowdsec_openresty_acquis
  when: proxy == 'openresty'

- name: Crowdsec | Remove generated duplicates of the OpenResty log acquisition
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ crowdsec_openresty_acquis_extra | select('search', '/setup\\.[^/]+$') | list }}"
  vars:
    crowdsec_openresty_acquis_extra: "{{ crowdsec_openresty_acquis.files | map(attribute='path') | reject('equalto', '/etc/crowdsec/acquis.d/openresty.yaml') | list }}"
  when: proxy == 'openresty'
  notify: Restart crowdsec

- name: Crowdsec | Assert no other acquisition file reads the OpenResty logs
  ansible.builtin.assert:
    that:
      - crowdsec_openresty_acquis_extra | reject('search', '/setup\\.[^/]+$') | list | length == 0
    fail_msg: >-
      {{ crowdsec_openresty_acquis_extra | reject('search', '/setup\\.[^/]+$') | join(', ') }}
      also read {{ crowdsec_openresty_logs_dir }}, which /etc/crowdsec/acquis.d/openresty.yaml
      already covers. Every request would be counted twice. Remove those entries.
    quiet: true
  vars:
    crowdsec_openresty_acquis_extra: "{{ crowdsec_openresty_acquis.files | map(attribute='path') | reject('equalto', '/etc/crowdsec/acquis.d/openresty.yaml') | list }}"
  when: proxy == 'openresty'

- name: Crowdsec | Ensure Security Engine is running and enabled
  ansible.builtin.systemd:
    name: crowdsec
    state: started
    enabled: true

# Bouncer packages auto-register against the LAPI during their own postinst (see
# configure-bouncer-*.yml) and need it reachable at that point, so config overrides
# must be live before we get there.
- name: Crowdsec | Flush handlers so config overrides apply before the bouncer installs
  ansible.builtin.meta: flush_handlers
