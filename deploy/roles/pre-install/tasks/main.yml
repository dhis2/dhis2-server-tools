---
# Same checks as roles/crowdsec/tasks/main.yml, which only runs at the end of the proxy
# role, after postgres and the proxy are already deployed. Failing here stops the run
# before anything changes. The defaults mirror roles/crowdsec/defaults/main.yml.
- name: Pre-flight | Assert CrowdSec settings on [web] hosts
  ansible.builtin.assert:
    that:
      - hostvars[item]['ansible_connection'] | default('lxd') == 'lxd'
      - >-
        hostvars[item]['proxy'] | default('') == 'openresty'
        or not (hostvars[item]['crowdsec_bouncer_enabled'] | default(true) | bool)
      - >-
        not (hostvars[item]['crowdsec_bouncer_enabled'] | default(true) | bool)
        or (hostvars[item]['crowdsec_bouncer_bouncing_on_type'] | default('ban') == 'ban'
            and hostvars[item]['crowdsec_bouncer_fallback_remediation'] | default('ban') == 'ban')
        or (hostvars[item]['crowdsec_bouncer_captcha_site_key'] | default('') | length > 0
            and hostvars[item]['crowdsec_bouncer_captcha_secret_key'] | default('') | length > 0)
    fail_msg: >-
      {{ item }}: crowdsec_enabled=true needs ansible_connection=lxd, and the bouncer needs
      proxy=openresty (or set crowdsec_bouncer_enabled=false for detection only). Captcha
      remediation needs crowdsec_bouncer_captcha_site_key and
      crowdsec_bouncer_captcha_secret_key.
    quiet: true
  loop: "{{ groups['web'] | default([]) }}"
  when: hostvars[item]['crowdsec_enabled'] | default(false) | bool
  tags: [always]

- name: Ensure secrets directory exists
  vars:
    ansible_connection: local
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0700'
    owner: "{{ lookup('env', 'USER') }}"
    group: "{{ lookup('pipe', 'id -gn') | trim }}"
  tags: [db_password_generate]
  delegate_to: 127.0.0.1
  loop:
    - "/opt/ansible/"
    - "/opt/ansible/secrets/"

- name: Ensure db_password files are owned by {{ lookup('env', 'USER') }}
  vars:
    ansible_connection: local
  become: true
  ansible.builtin.file:
    dest: "{{ item }}"
    owner: "{{ lookup('env', 'USER') }}"
    group: "{{ lookup('pipe', 'id -gn') | trim }}"
    mode: '0600'
  tags: [db_password_generate]
  delegate_to: 127.0.0.1
  with_fileglob:
    - /opt/ansible/secrets/*
  when: item is file

- name: Pre-requisites | {{ ansible_connection }}
  ansible.builtin.include_tasks: "{{ ansible_connection }}.yml"
  tags: [always, sysctl-conf]  # TODO why always needed
