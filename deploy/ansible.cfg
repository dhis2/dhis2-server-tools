[defaults]
inventory = ./inventory/hosts
deprecation_warnings = False
interpreter_python = /usr/bin/python3
host_key_checking = False
# log_path=./deploy.log
# /tmp is tmpfs (RAM-backed) on Ubuntu - large become-user file transfers
# (Doris binaries, the DHIS2 war file) can hit ENOSPC under memory pressure
# despite the real disk having plenty of room. /var/tmp is the same
# world-writable + sticky-bit permissions, backed by real disk instead.
remote_tmp = /var/tmp/
local_tmp  = ~/.ansible/tmp
# Explicit so sub-playbooks under playbooks/ resolve roles and custom
# filters/library regardless of which playbook is invoked.
roles_path = ./roles
filter_plugins = ./filter_plugins
library = ./library

# callbacks_enabled = timer, profile_tasks
# stdout_callback = yaml

# display_skipped_hosts = no  # a bug  https://github.com/ansible/ansible/issues/51042
[callback_log_plays]
log_folder = ./log/ansible/hosts
